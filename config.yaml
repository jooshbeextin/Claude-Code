# ─────────────────────────────────────────────────────────────
# Telegram Delivery (optional — leave blank to skip)
# ─────────────────────────────────────────────────────────────
# To enable Telegram:
#   1. Open Telegram → search for @BotFather → send /newbot
#   2. Give your bot a name (e.g. "Josh Executive Report") and a username
#   3. BotFather will give you a token — add it to .env as TELEGRAM_BOT_TOKEN
#   4. Start a chat with your new bot (search it, press Start)
#   5. Visit in browser:
#        https://api.telegram.org/bot<YOUR_TOKEN>/getUpdates
#      Look for "chat": {"id": 123456789} — that number is your TELEGRAM_CHAT_ID
#   6. Add TELEGRAM_CHAT_ID to .env
#
telegram:
  enabled: true

# ─────────────────────────────────────────────────────────────
# Report Preferences
# ─────────────────────────────────────────────────────────────
report:
  model: "claude-opus-4-6"       # Claude model to use for generation
  save_locally: true              # Save a dated .md file in ./reports/
  reports_directory: "reports"   # Directory for saved reports
